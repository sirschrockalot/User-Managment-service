version: '3.8'

services:
  user-management-service:
    build: .
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - MONGODB_URI=mongodb://mongodb:27017/user-management
      - MONGODB_DATABASE=user-management
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_EXPIRES_IN=24h
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - crm-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=user-management
    volumes:
      - mongodb_data:/data/db
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network

volumes:
  mongodb_data:
  redis_data:

networks:
  crm-network:
    driver: bridge
